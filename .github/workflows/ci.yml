name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Run the whole pipeline by hand from the Actions tab (it deploys only from main).
  workflow_dispatch:

# One deploy at a time; a newer push waits for the one in flight instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, Typecheck, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      # The typecheck needs the generated database client; locally it already exists, here it does not.
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      # Shipped (non-dev) dependencies only; fails on high or critical. Dev-tool advisories and moderate
      # ones reach us as Dependabot pull requests instead of blocking the build.
      - run: npm audit --omit=dev --audit-level=high
      # The real reference documents must never be in the tree (CLAUDE.md, "Data rules").
      - run: '! git ls-files | grep -E "^(Financial Reporting|docs/private)/"'
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  # Everything below runs on main only, after CI passes. It is switched on by the repository variable
  # DEPLOY_ENABLED=true and aimed by variables, so the same jobs serve dev now and production later:
  #   secrets:   RAILWAY_TOKEN (a project token for ONE Railway environment), VERCEL_TOKEN
  #   variables: RAILWAY_API_SERVICE (api-dev now, audit-differently for production), VERCEL_ORG_ID,
  #              VERCEL_PROJECT_ID, API_URL and WEB_URL (the public addresses the smoke test checks)
  # Railway is declared in .railway/railway.ts; a project token is tied to one environment, so the apply and the
  # deploy touch dev or production depending on which token is set. Vercel's own GitHub deploy of main is turned
  # off in apps/web/vercel.json, so a push deploys once, and only when CI has passed.
  railway-config:
    name: Apply Railway config (.railway/railway.ts)
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The railway SDK (root devDependency) evaluates .railway/railway.ts.
      - run: npm ci
      - run: npm install -g @railway/cli@5.63.1
      - run: railway config plan --verbose
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # No --confirm-destructive: a plan that deletes anything fails here.
      - run: railway config apply --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-api:
    name: Deploy API (Railway)
    needs: [ci, railway-config]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # A normal deploy takes a few minutes; `railway up` has been known to hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Railway rebuilds the API only when a file in its watch paths changed (.railway/railway.ts: apps/api/**,
      # packages/types/**, docs/terms/** and package*.json, gitignore-style, so the last matches at any depth). Keep this
      # list in step with that one. A push that changed one of them uploads and waits for the build (--ci), so a
      # failed build fails this job; any other push uploads nothing, since Railway would build nothing and --ci would
      # wait for a build that never comes. A re-run, or a push whose previous commit is unknown, uploads without waiting.
      - name: Did this push change the API?
        id: api
        run: |
          before='${{ github.event.before }}'
          if [ "${{ github.run_attempt }}" != "1" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "deploy=detach" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(apps/api/|packages/types/|docs/terms/)|(^|/)package[^/]*\.json$'; then
            echo "deploy=wait" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=skip" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.api.outputs.deploy != 'skip'
        run: npm install -g @railway/cli@5.63.1
      # Uploads the checked-out tree; Railway builds and starts it (deploy:start runs the migrations and role:ensure).
      - if: steps.api.outputs.deploy == 'wait'
        run: railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - if: steps.api.outputs.deploy == 'detach'
        run: railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-web:
    name: Deploy web (Vercel)
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The project's settings (root apps/web, Vite, Node 22, its environment variables) live in Vercel; this
      # uploads the tree and Vercel builds it.
      - run: npx vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

  # Proves the three pieces work together after a deploy: the API answers, the site answers, and the API accepts
  # the site's origin (a wrong origin list is what breaks sign-in).
  smoke-test:
    name: Smoke test (API, web, CORS)
    needs: [deploy-api, deploy-web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: API is healthy
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "${{ vars.API_URL }}/api/health" || true)
            echo "$body" | grep -q '"status":"ok"' && { echo "$body"; exit 0; }
            sleep 10
          done
          echo "API did not become healthy"; exit 1
      - name: Web serves the app and its public pages
        run: |
          for path in / /privacy/ /terms/ /release-notes/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${{ vars.WEB_URL }}$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
      - name: API accepts the web origin and refuses another
        run: |
          # grep -c exits 1 when it counts zero, which is the right answer for the foreign origin: tolerate it.
          ok=$(curl -s -D - -o /dev/null -H "Origin: ${{ vars.WEB_URL }}" "${{ vars.API_URL }}/api/health" | grep -ci "access-control-allow-origin: ${{ vars.WEB_URL }}" || true)
          bad=$(curl -s -D - -o /dev/null -H "Origin: https://evil.example" "${{ vars.API_URL }}/api/health" | grep -ci "access-control-allow-origin" || true)
          echo "web origin allowed: $ok, foreign origin allowed: $bad"
          [ "$ok" -ge 1 ] && [ "$bad" -eq 0 ]
