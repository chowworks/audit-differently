name: Remove grooming label on sprint

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  remove:
    if: startsWith(github.event.label.name, 'sprint:')
    runs-on: ubuntu-latest
    steps:
      - name: Remove "Need Grooming" once the issue has a sprint label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: '♻️ Need Grooming',
              });
            } catch (e) {
              if (e.status !== 404) throw e;
            }
